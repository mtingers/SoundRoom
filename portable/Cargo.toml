[workspace]
members = ["crates/engine", "crates/server", "crates/client", "crates/tui", "crates/platform"]
resolver = "2"
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"
[workspace.dependencies]
serde = { version = "=1.0.159", features = ["derive"] }
serde_json = "=1.0.95"
